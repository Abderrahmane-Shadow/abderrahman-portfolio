<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Identity Icons (Personal Portrait) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abderrahman El Harakani | Data Scientist & AI Engineer</title>
    <meta name="description" content="Portfolio of Abderrahman El Harakani - Data Science Master's Student, AI Engineer, Machine Learning, Deep Learning, and Generative AI specialist based in Morocco." />
    
    <!-- Google Fonts: Inter & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Prevent Theme & Language Flash -->
    <script>
      try {
        const savedTheme = localStorage.getItem('ae_portfolio_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const savedLang = localStorage.getItem('ae_portfolio_lang') || 'en';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {
        // Fallback default
        document.documentElement.classList.remove('dark');
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
    </script>
  </head>
  <body class="bg-white text-slate-900 dark:bg-[#0B1120] dark:text-[#F8FAFC] transition-colors duration-300 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
